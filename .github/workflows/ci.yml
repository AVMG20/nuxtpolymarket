name: ci

# bitploy deploys main itself: every push to main is built on the server from
# the Dockerfile and goes live once it answers its health check. This workflow
# only checks the code, so a red run here does not stop a deploy.
on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push to an open pull request supersedes the run
# still going for the commit nobody is reviewing any more.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    # The balance concurrency tests exercise real Postgres row locking, so they
    # need a real database — without one they silently skip and prove nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polynux
          POSTGRES_PASSWORD: polynux
          POSTGRES_DB: polynux
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://polynux:polynux@localhost:5432/polynux

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The head commit, not the merge commit a pull_request event checks
          # out by default, so opening a pull request builds and tags exactly
          # what pushing the branch would have.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `migrate` only applies what is committed, so schema.ts running ahead of
      # drizzle/ ships a stale database and the app boots against tables it does
      # not have. A clean tree after `generate` proves they agree; `check`
      # catches two branches both claiming the next migration number.
      - name: Require committed migrations for schema changes
        run: |
          bunx drizzle-kit check
          bunx drizzle-kit generate --name ci_drift_probe < /dev/null
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "server/database/schema.ts changed without a committed migration."
            echo "Run 'bun run db:generate' and commit the drizzle/ output."
            exit 1
          fi

      - name: Apply database migrations
        run: bunx drizzle-kit migrate

      # vue-tsc keeps its incremental state here (see the typecheck script). It
      # compares file contents, not mtimes, so the last run's state is safe to
      # reuse on a fresh checkout and only the files that changed get rechecked.
      - name: Restore typecheck state
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/vue-tsc
          key: vue-tsc-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: vue-tsc-

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # The image build is the build check for pull requests: it compiles the app
  # exactly as bitploy will. Main is built by bitploy on push, so it is not
  # built twice. Nothing is published.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

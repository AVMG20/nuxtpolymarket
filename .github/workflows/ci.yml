name: ci

on:
  # Branch work is covered entirely by the pull_request event. Listening for
  # pushes on branches too meant every pull request opened seconds after its
  # push, which cancelled the push run — and a cancelled run is attached to the
  # head commit, so a green pull request still showed a red X for a run that
  # was superseded rather than broken.
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One run per branch: a new push to an open pull request supersedes the run
# still going for the commit nobody is reviewing any more, whose 15-minute
# deployment poll would otherwise write a stale comment over a fresher one.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Which pull request, if any, this push belongs to. Publishing an image is
  # only worth it for main and for branches someone is actually reviewing.
  context:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr: ${{ steps.pr.outputs.number }}

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Find the open pull request for this branch
        id: pr
        env:
          EVENT_PR: ${{ github.event.number }}
        run: |
          number=$EVENT_PR
          if [ -z "$number" ]; then
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
              --state open --json number --jq '.[0].number // empty')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME -> pr ${number:-none}"

      # The image has to build before Coolify hears about the preview at all,
      # so claim the comment now rather than leaving the pull request silent
      # for the length of a build.
      - name: Claim the preview comment
        if: steps.pr.outputs.number != '' && github.ref != 'refs/heads/main'
        env:
          PR: ${{ steps.pr.outputs.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n' \
            "### Preview deployment" "" \
            "Building the image — [ci run]($RUN)" \
            | .github/scripts/pr-preview-comment.sh "$PR"

  checks:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    # The balance concurrency tests exercise real Postgres row locking, so they
    # need a real database — without one they silently skip and prove nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polynux
          POSTGRES_PASSWORD: polynux
          POSTGRES_DB: polynux
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://polynux:polynux@localhost:5432/polynux

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The head commit, not the merge commit a pull_request event checks
          # out by default, so opening a pull request builds and tags exactly
          # what pushing the branch would have.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `migrate` only applies what is committed, so schema.ts running ahead of
      # drizzle/ ships a stale database and the app boots against tables it does
      # not have. A clean tree after `generate` proves they agree; `check`
      # catches two branches both claiming the next migration number.
      - name: Require committed migrations for schema changes
        run: |
          bunx drizzle-kit check
          bunx drizzle-kit generate --name ci_drift_probe < /dev/null
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "server/database/schema.ts changed without a committed migration."
            echo "Run 'bun run db:generate' and commit the drizzle/ output."
            exit 1
          fi

      - name: Apply database migrations
        run: bunx drizzle-kit migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # The image build is the build check: it compiles the app exactly as it will
  # ship. Publishing is still conditional so a run that somehow reaches here
  # without a pull request fails on a broken bundle without putting anything in
  # the registry.
  image:
    needs: [context, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      # Previews run the image built here rather than rebuilding on the Coolify
      # host, so a pull request has to publish too — not just main.
      PUBLISH: ${{ github.ref == 'refs/heads/main' || needs.context.outputs.pr != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=sha derives from github.sha, which a pull_request event sets to
          # the merge commit — a sha nothing else in this workflow refers to,
          # and one the preview then cannot pull. Tag the commit that was
          # actually checked out and built.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Coolify pulls the image it was told about rather than building anything, so
  # the deploy is a pull and a container swap.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK is not set — image published, deploy not triggered."
            exit 0
          fi
          code=$(curl -s -o /tmp/deploy.out -w '%{http_code}' -X GET "$WEBHOOK" \
            -H "Authorization: Bearer $TOKEN")
          echo "coolify responded $code"
          cat /tmp/deploy.out
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

  # A preview is the same published image pointed at a per-pull-request domain.
  # Coolify used to build these itself, which meant a second full Nuxt build on
  # the deploy host — the step that needs ~6 GB and gets OOM-killed when other
  # previews are already resident.
  preview:
    needs: [context, image]
    if: needs.context.outputs.pr != '' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.context.outputs.pr }}
      # The same expression the image job tags with.
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Read the Coolify endpoint out of the webhook
        id: coolify
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK is not set — image published, preview not deployed."
            exit 0
          fi
          # The webhook already carries both halves we need, so a preview costs
          # no extra secrets: https://coolify.host/api/v1/deploy?uuid=xxx&...
          base=${WEBHOOK%%/api/v1/deploy*}
          uuid=$(printf '%s' "$WEBHOOK" | sed -n 's/.*[?&]uuid=\([^&]*\).*/\1/p')
          if [ "$base" = "$WEBHOOK" ] || [ -z "$uuid" ]; then
            echo "Could not read a base URL and uuid out of COOLIFY_WEBHOOK."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Deploy the preview
        id: deploy
        if: steps.coolify.outputs.base != ''
        env:
          BASE: ${{ steps.coolify.outputs.base }}
          UUID: ${{ steps.coolify.outputs.uuid }}
        run: |
          code=$(curl -s -o /tmp/preview.out -w '%{http_code}' -X POST \
            "$BASE/api/v1/deploy?uuid=$UUID&pull_request_id=$PR&docker_tag=sha-$SHA" \
            -H "Authorization: Bearer $TOKEN")
          echo "coolify responded $code for pr $PR (sha-$SHA)"
          cat /tmp/preview.out
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

          deployment=$(jq -r '.deployments[0].deployment_uuid // empty' /tmp/preview.out)
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

          # Only the deployment record knows its own dashboard path, which is
          # nested under the project and environment rather than the app uuid.
          log=$(curl -s "$BASE/api/v1/deployments/$deployment" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.deployment_url // empty')
          # Coolify answers with a path, which a comment renders relative to
          # github.com.
          case "$log" in /*) log="$BASE$log" ;; esac
          echo "log=$log" >> "$GITHUB_OUTPUT"

          printf '%s\n' \
            "### Preview deployment" "" \
            "Building \`sha-${SHA:0:7}\`${log:+ — [deployment log]($log)}" \
            | .github/scripts/pr-preview-comment.sh "$PR"

      # Coolify queues the deploy and answers immediately, so the comment can
      # only carry a URL once the container is actually up.
      - name: Wait for the deployment
        id: wait
        if: steps.deploy.outputs.deployment != ''
        env:
          BASE: ${{ steps.coolify.outputs.base }}
          UUID: ${{ steps.coolify.outputs.uuid }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
        run: |
          status=unknown
          for _ in $(seq 1 90); do
            status=$(curl -s "$BASE/api/v1/deployments/$DEPLOYMENT" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.status // "unknown"')
            case "$status" in
              queued|in_progress|unknown) sleep 10 ;;
              *) break ;;
            esac
          done
          echo "deployment $DEPLOYMENT finished as $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

          # No endpoint lists a preview's generated domain, so rebuild it from
          # the template the application deploys previews with.
          app=$(curl -s "$BASE/api/v1/applications/$UUID" -H "Authorization: Bearer $TOKEN")
          template=$(printf '%s' "$app" | jq -r '.preview_url_template // empty')
          domain=$(printf '%s' "$app" | jq -r '.fqdn // empty' | cut -d, -f1 | sed -E 's#^https?://##; s#/.*##')
          url=${template//\{\{pr_id\}\}/$PR}
          url=${url//\{\{domain\}\}/$domain}
          # A template holding {{random}} names a domain only Coolify knows.
          case "$url" in
            *'{{'* | '') url='' ;;
            http*) ;;
            *) url="https://$url" ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report the preview on the pull request
        # A cancelled run has been replaced by a newer one, which owns the
        # comment now.
        if: ${{ !cancelled() && steps.deploy.outputs.deployment != '' }}
        env:
          LOG: ${{ steps.deploy.outputs.log }}
          STATUS: ${{ steps.wait.outputs.status }}
          URL: ${{ steps.wait.outputs.url }}
        run: |
          case "$STATUS" in
            finished) state="Ready — ${URL:-open it from the Coolify dashboard}" ;;
            queued | in_progress) state="Still building after 15 minutes" ;;
            *) state="Failed (\`${STATUS:-unknown}\`)" ;;
          esac
          printf '%s\n' \
            "### Preview deployment" "" \
            "$state" "" \
            "\`sha-${SHA:0:7}\`${LOG:+ — [deployment log]($LOG)}" \
            | .github/scripts/pr-preview-comment.sh "$PR"

  # Closing the pull request takes the preview's containers, volumes and network
  # with it. Without this the deploy host keeps every preview ever opened.
  preview-teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Remove the preview
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK is not set — nothing to tear down."
            exit 0
          fi
          base=${WEBHOOK%%/api/v1/deploy*}
          uuid=$(printf '%s' "$WEBHOOK" | sed -n 's/.*[?&]uuid=\([^&]*\).*/\1/p')
          if [ "$base" = "$WEBHOOK" ] || [ -z "$uuid" ]; then
            echo "Could not read a base URL and uuid out of COOLIFY_WEBHOOK."
            exit 1
          fi

          code=$(curl -s -o /tmp/teardown.out -w '%{http_code}' -X DELETE \
            "$base/api/v1/applications/$uuid/previews/$PR" \
            -H "Authorization: Bearer $TOKEN")
          echo "coolify responded $code for pr $PR"
          cat /tmp/teardown.out
          # A preview that was never created is already in the state we want.
          [ "$code" -lt 300 ] || [ "$code" -eq 404 ]

      # The comment outlives the preview, and its link stops resolving the
      # moment the containers go away.
      - name: Retire the pull request comment
        if: env.WEBHOOK != ''
        run: |
          printf '%s\n' "### Preview deployment" "" "Torn down with this pull request." \
            | .github/scripts/pr-preview-comment.sh "$PR" --edit-only

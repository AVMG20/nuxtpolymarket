name: ci

on: push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    runs-on: ubuntu-latest

    # The balance concurrency tests exercise real Postgres row locking, so they
    # need a real database — without one they silently skip and prove nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polynux
          POSTGRES_PASSWORD: polynux
          POSTGRES_DB: polynux
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://polynux:polynux@localhost:5432/polynux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Push database schema
        run: bunx drizzle-kit push --force

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # The image build is the build check: it compiles the app exactly as it will
  # ship. Branches build without publishing, so a broken bundle fails the run
  # without putting anything in the registry.
  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Coolify pulls the image it was told about rather than building anything, so
  # the deploy is a pull and a container swap.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK is not set — image published, deploy not triggered."
            exit 0
          fi
          code=$(curl -s -o /tmp/deploy.out -w '%{http_code}' -X GET "$WEBHOOK" \
            -H "Authorization: Bearer $TOKEN")
          echo "coolify responded $code"
          cat /tmp/deploy.out
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

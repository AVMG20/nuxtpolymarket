name: ci

on:
  push:
  # Opening a pull request is what turns an already-pushed branch into
  # something worth previewing, and no push follows it — without this the
  # branch keeps whatever it had, which for a branch pushed before the pull
  # request existed is no published image and no preview at all.
  pull_request:
    types: [opened, reopened, closed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Which pull request, if any, this push belongs to. Publishing an image is
  # only worth it for main and for branches someone is actually reviewing.
  context:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.number }}

    steps:
      - name: Find the open pull request for this branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.number }}
        run: |
          number=$EVENT_PR
          if [ -z "$number" ]; then
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
              --state open --json number --jq '.[0].number // empty')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME -> pr ${number:-none}"

  checks:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    # The balance concurrency tests exercise real Postgres row locking, so they
    # need a real database — without one they silently skip and prove nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polynux
          POSTGRES_PASSWORD: polynux
          POSTGRES_DB: polynux
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://polynux:polynux@localhost:5432/polynux

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The head commit, not the merge commit a pull_request event checks
          # out by default, so opening a pull request builds and tags exactly
          # what pushing the branch would have.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply database migrations
        run: bunx drizzle-kit migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # The image build is the build check: it compiles the app exactly as it will
  # ship. Branches without a pull request build without publishing, so a broken
  # bundle fails the run without putting anything in the registry.
  image:
    needs: [context, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      # Previews run the image built here rather than rebuilding on the Coolify
      # host, so a pull request has to publish too — not just main.
      PUBLISH: ${{ github.ref == 'refs/heads/main' || needs.context.outputs.pr != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Coolify pulls the image it was told about rather than building anything, so
  # the deploy is a pull and a container swap.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK is not set — image published, deploy not triggered."
            exit 0
          fi
          code=$(curl -s -o /tmp/deploy.out -w '%{http_code}' -X GET "$WEBHOOK" \
            -H "Authorization: Bearer $TOKEN")
          echo "coolify responded $code"
          cat /tmp/deploy.out
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

  # A preview is the same published image pointed at a per-pull-request domain.
  # Coolify used to build these itself, which meant a second full Nuxt build on
  # the deploy host — the step that needs ~6 GB and gets OOM-killed when other
  # previews are already resident.
  preview:
    needs: [context, image]
    if: needs.context.outputs.pr != '' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy the preview
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          PR: ${{ needs.context.outputs.pr }}
          # Matches what docker/metadata-action tagged, which on a pull_request
          # event is the head sha rather than GITHUB_SHA's merge commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK is not set — image published, preview not deployed."
            exit 0
          fi
          # The webhook already carries both halves we need, so a preview costs
          # no extra secrets: https://coolify.host/api/v1/deploy?uuid=xxx&...
          base=${WEBHOOK%%/api/v1/deploy*}
          uuid=$(printf '%s' "$WEBHOOK" | sed -n 's/.*[?&]uuid=\([^&]*\).*/\1/p')
          if [ "$base" = "$WEBHOOK" ] || [ -z "$uuid" ]; then
            echo "Could not read a base URL and uuid out of COOLIFY_WEBHOOK."
            exit 1
          fi

          code=$(curl -s -o /tmp/preview.out -w '%{http_code}' -X POST \
            "$base/api/v1/deploy?uuid=$uuid&pull_request_id=$PR&docker_tag=sha-$SHA" \
            -H "Authorization: Bearer $TOKEN")
          echo "coolify responded $code for pr $PR (sha-$SHA)"
          cat /tmp/preview.out
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

  # Closing the pull request takes the preview's containers, volumes and network
  # with it. Without this the deploy host keeps every preview ever opened.
  preview-teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Remove the preview
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          PR: ${{ github.event.number }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK is not set — nothing to tear down."
            exit 0
          fi
          base=${WEBHOOK%%/api/v1/deploy*}
          uuid=$(printf '%s' "$WEBHOOK" | sed -n 's/.*[?&]uuid=\([^&]*\).*/\1/p')
          if [ "$base" = "$WEBHOOK" ] || [ -z "$uuid" ]; then
            echo "Could not read a base URL and uuid out of COOLIFY_WEBHOOK."
            exit 1
          fi

          code=$(curl -s -o /tmp/teardown.out -w '%{http_code}' -X DELETE \
            "$base/api/v1/applications/$uuid/previews/$PR" \
            -H "Authorization: Bearer $TOKEN")
          echo "coolify responded $code for pr $PR"
          cat /tmp/teardown.out
          # A preview that was never created is already in the state we want.
          [ "$code" -lt 300 ] || [ "$code" -eq 404 ]

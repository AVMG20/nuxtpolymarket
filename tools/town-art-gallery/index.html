<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polytown · Model workshop</title>
<style>
:root{color-scheme:dark;--bg:#151d20;--panel:#202c30;--line:#34464b;--text:#e9efe7;--muted:#a9bbb9;--accent:#c7dc92}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{padding:28px 4vw 20px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.19em;font-weight:700}h1{font-size:30px;letter-spacing:-.04em;margin:6px 0}p{color:var(--muted);margin:4px 0}nav{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:20px}label{display:grid;gap:5px;font-size:11px;color:var(--muted)}select,button,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}button.active{background:var(--accent);color:var(--bg)}#count{margin-left:auto;color:var(--accent)}main{padding:24px 4vw}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.card{text-align:left;padding:0;overflow:hidden;background:var(--panel)}.card img{width:100%;aspect-ratio:1;display:block;background:#819177}.card div{padding:10px 13px}.card strong{display:block}.card span{font-size:12px;color:var(--muted)}#status{margin-bottom:16px}dialog{width:min(1050px,96vw);height:min(840px,94vh);padding:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text)}dialog::backdrop{background:#000a}dialog header{padding:14px 20px;display:flex;align-items:center;gap:10px}dialog h2{margin:0;font-size:19px;flex:1}#stage{height:calc(100% - 155px);min-height:200px;background:#819177}#stage canvas{display:block;width:100%;height:100%;touch-action:none}footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px}#level{width:70px}#error{color:#f2ae9c}body.sheet .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}body.sheet .card div{padding:7px;font-size:11px}body.sheet .card span{font-size:10px}@media(max-width:600px){header{padding:18px}main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}#count{margin-left:0}h1{font-size:24px}dialog footer{font-size:11px;gap:5px}button,select{padding:8px}}
</style></head><body>
<header><div class="eyebrow">POLYTOWN / MODEL WORKSHOP</div><h1>Every building. Every level.</h1><p>Live game models, consistent lighting, and a closer look at each upgrade. Click any model to inspect it.</p>
<nav><label>Building<select id="building"><option value="all">All buildings</option></select></label><label>Production tier<select id="tier"><option value="all">All tiers</option></select></label><label>Upgrade levels<select id="levels"><option value="all">Every level</option><option value="first">Level 1 only</option><option value="max">Maximum level only</option><option value="stages">Stage changes + maximum</option></select></label><button id="sheet">Compact view</button><button id="export">Export contact sheet</button><span id="count"></span></nav></header>
<main><p id="status" role="status">Preparing models…</p><p id="error" role="alert"></p><section id="grid" class="grid" aria-label="Building models"></section></main>
<dialog id="inspector"><header><h2 id="title"></h2><button id="close" aria-label="Close inspector">Close</button></header><div id="stage"></div><footer><button id="previous">Previous level</button><label>Level<select id="level"></select></label><button id="next">Next level</button><button id="rotate">Auto rotate</button><button id="reset">Reset view</button><button id="save">Save PNG</button><span>Drag to orbit · scroll to zoom</span></footer></dialog>
<dialog id="export-preview"><header><h2>Image export</h2><a id="export-link">Download PNG</a><button onclick="this.closest('dialog').close()">Close export</button></header><img id="export-image" alt="Exported building artwork" style="display:block;width:100%;height:auto"></dialog>
<script type="module" src="/gallery.js" onerror="document.getElementById('error').textContent='Could not load the model bundle. Check the gallery terminal for build errors.'"></script></body></html>
